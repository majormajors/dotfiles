
[env]
TERM = "xterm-256color"

[font]
size = 12.0

[font.bold]
family = "Iosevka Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Iosevka Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Iosevka Nerd Font"
style = "Italic"

[font.normal]
family = "Iosevka Nerd Font"
style = "Regular"

[window]
opacity = 1
padding = { x = 5, y = 5 }
dynamic_padding = true

[general]
import = [
  "~/.config/alacritty/themes/aura-theme.toml"
]
